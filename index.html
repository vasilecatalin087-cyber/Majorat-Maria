<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria · Galerie foto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fffdfd; --blush:#fbeef0; --powder:#f3d5db; --rose:#c97b8d; --ink:#3a2a2e; --muted:#8a7378;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
.notice{background:var(--powder);text-align:center;padding:.7rem 1.2rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));font-size:.92rem;font-weight:400}

.hero{min-height:calc(100vh - 3rem);display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(100deg,var(--blush),var(--white) 70%)}
.hero .txt{display:flex;flex-direction:column;justify-content:center;padding:clamp(2rem,6vw,6rem)}
.hero h1{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(5rem,16vw,13rem);line-height:.85;letter-spacing:-.02em}
.hero p{max-width:26rem;margin:1.8rem 0 2.2rem;color:var(--muted);font-size:1.05rem}
.hero .pic{background:var(--powder);min-height:60vh}
.hero .pic img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.go{align-self:flex-start;font:inherit;font-weight:400;border:1px solid var(--rose);background:var(--rose);color:#fff;padding:.8rem 1.8rem;border-radius:999px;text-decoration:none;transition:background .2s}
.go:hover{background:#b5687a}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .pic{order:-1;min-height:55vh}.hero .txt{padding:2rem 1.5rem 3rem}}

.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.8rem clamp(1rem,4vw,3rem);padding-top:calc(.8rem + env(safe-area-inset-top,0px));background:rgba(255,253,253,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--powder)}
.bar .count{font-family:var(--serif);font-size:1.25rem;font-style:italic}
.bar .actions{display:flex;flex-wrap:wrap;gap:.5rem}
button,.dl{font:inherit;font-weight:400;font-size:.9rem;border:1px solid var(--rose);background:transparent;color:var(--ink);padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
button:hover,.dl:hover{background:var(--blush)}
button.primary{background:var(--rose);color:#fff}
button.primary:hover{background:#b5687a}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,.dl:focus-visible,.go:focus-visible,.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.progress{height:2px;background:var(--powder);display:none}
.progress i{display:block;height:100%;width:0;background:var(--rose)}

.grid{columns:3 260px;column-gap:clamp(.6rem,1.5vw,1.2rem);padding:clamp(1rem,3vw,2.5rem) clamp(1rem,4vw,3rem) 4rem}
.tile{position:relative;break-inside:avoid;margin-bottom:clamp(.6rem,1.5vw,1.2rem);background:var(--blush);min-height:180px;cursor:zoom-in}
.tile img{display:block;width:100%;height:auto}
.tile .pick{position:absolute;top:.7rem;left:.7rem;width:1.9rem;height:1.9rem;padding:0;border-radius:50%;border:1.5px solid #fff;background:rgba(58,42,46,.25);color:#fff;display:grid;place-items:center;font-size:1rem;line-height:1}
.tile.on{outline:3px solid var(--rose);outline-offset:-3px}
.tile.on .pick{background:var(--rose);border-color:var(--rose)}
.tile.on .pick::after{content:"✓"}
.empty{padding:4rem 1.5rem;text-align:center;color:var(--muted);display:none}
footer{text-align:center;padding:2.5rem 1rem 3rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--powder)}

.lb{position:fixed;inset:0;z-index:20;background:rgba(255,250,251,.97);display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:1.2rem}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:78vh;object-fit:contain}
.lb .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="notice" id="notice"></div>

<header class="hero">
  <div class="txt">
    <h1>Maria</h1>
    <p>Aici găsești toate fotografiile tale. Le poți descărca pe toate odată sau poți alege doar pe cele preferate.</p>
    <a class="go" href="#galerie">Vezi toate pozele</a>
  </div>
  <div class="pic" id="heroPic"></div>
</header>

<div class="bar" id="galerie">
  <span class="count" id="count"></span>
  <div class="actions">
    <button id="toggleAll">Selectează toate</button>
    <button id="dlSel" disabled>Descarcă selecția</button>
    <button id="dlAll" class="primary">Descarcă toate (zip)</button>
  </div>
</div>
<div class="progress" id="prog"><i></i></div>

<main class="grid" id="grid"></main>
<p class="empty" id="empty">Pozele se încarcă sau lista nu a fost generată încă. Dacă tocmai le-ai încărcat, mai așteaptă un minut și reîncarcă pagina.</p>

<footer id="foot"></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Previzualizare fotografie">
  <img id="lbImg" alt="">
  <div class="row">
    <button id="prev">Înapoi</button>
    <button id="lbPick">Selectează</button>
    <a class="dl" id="lbDl" download>Descarcă</a>
    <button id="next">Înainte</button>
    <button id="close">Închide</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== SETĂRI ===== */
const CLOSE_DATE = "2026-12-09";   // data la care se închide site-ul (AAAA-LL-ZZ)
const ZIP_NAME   = "pozele-mariei.zip";
/* ================== */

const $ = id => document.getElementById(id);
const selected = new Set();
let PHOTOS = [], current = 0;
const full  = n => "poze/" + encodeURIComponent(n);
const thumb = n => "thumbs/" + encodeURIComponent(n);

const close = new Date(CLOSE_DATE + "T23:59:59");
const days = Math.max(0, Math.ceil((close - new Date()) / 864e5));
const dateRo = close.toLocaleDateString("ro-RO", {day:"numeric", month:"long", year:"numeric"});
$("notice").textContent = "Acest site este temporar și se va închide pe " + dateRo +
  (days > 0 ? " (mai sunt " + days + (days === 1 ? " zi" : " zile") + ")" : "") +
  ". Te rugăm să-ți descarci pozele până atunci.";
$("foot").textContent = "Galerie temporară. După " + dateRo + " pozele nu vor mai fi disponibile aici.";

fetch("photos.json", {cache: "no-cache"})
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => {
    PHOTOS = d.photos || [];
    if (d.hero) { const im = new Image(); im.alt = "Maria"; im.src = "thumbs/hero.jpg"; $("heroPic").appendChild(im); }
    build();
  })
  .catch(() => { $("empty").style.display = "block"; refresh(); });

function build(){
  const grid = $("grid");
  PHOTOS.forEach((name, i) => {
    const t = document.createElement("div");
    t.className = "tile"; t.tabIndex = 0; t.setAttribute("role", "button");
    t.setAttribute("aria-label", "Deschide fotografia " + (i + 1));
    const img = new Image(); img.loading = "lazy"; img.decoding = "async"; img.alt = "Fotografia " + (i + 1); img.src = thumb(name);
    const pick = document.createElement("button");
    pick.className = "pick"; pick.setAttribute("aria-label", "Selectează fotografia " + (i + 1));
    pick.addEventListener("click", e => { e.stopPropagation(); toggle(i); });
    t.append(img, pick);
    t.addEventListener("click", () => openLb(i));
    t.addEventListener("keydown", e => { if (e.key === "Enter") openLb(i); });
    grid.appendChild(t);
  });
  if (!PHOTOS.length) $("empty").style.display = "block";
  refresh();
}

function toggle(i){
  selected.has(i) ? selected.delete(i) : selected.add(i);
  $("grid").children[i].classList.toggle("on", selected.has(i));
  refresh();
}
function refresh(){
  const n = selected.size;
  $("count").textContent = PHOTOS.length + (PHOTOS.length === 1 ? " fotografie" : " fotografii") + (n ? " · " + n + " selectate" : "");
  $("dlSel").disabled = n === 0;
  $("dlSel").textContent = n ? "Descarcă selecția (" + n + ")" : "Descarcă selecția";
  $("toggleAll").textContent = n === PHOTOS.length && n > 0 ? "Deselectează toate" : "Selectează toate";
  $("dlAll").disabled = $("toggleAll").disabled = !PHOTOS.length;
  if ($("lb").classList.contains("open")) $("lbPick").textContent = selected.has(current) ? "Deselectează" : "Selectează";
}
$("toggleAll").onclick = () => {
  const all = selected.size === PHOTOS.length;
  PHOTOS.forEach((_, i) => { all ? selected.delete(i) : selected.add(i); $("grid").children[i].classList.toggle("on", !all); });
  refresh();
};

async function zipAndSave(indices){
  const btns = [$("dlAll"), $("dlSel")]; btns.forEach(b => b.disabled = true);
  const prog = $("prog"), bar = prog.firstElementChild; prog.style.display = "block"; bar.style.width = "0";
  try {
    const zip = new JSZip(); let done = 0;
    for (const i of indices) {
      const res = await fetch(full(PHOTOS[i]));
      if (!res.ok) throw new Error("Nu am putut încărca " + PHOTOS[i]);
      zip.file(PHOTOS[i], await res.blob());
      bar.style.width = (++done / indices.length * 80) + "%";
    }
    const blob = await zip.generateAsync({type:"blob", compression:"STORE"}, m => { bar.style.width = (80 + m.percent * .2) + "%"; });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = ZIP_NAME; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (err) {
    alert("Descărcarea nu a reușit: " + err.message + ". Încearcă cu mai puține poze selectate sau descarcă pozele pe rând.");
  } finally {
    prog.style.display = "none"; refresh();
  }
}
$("dlAll").onclick = () => zipAndSave(PHOTOS.map((_, i) => i));
$("dlSel").onclick = () => zipAndSave([...selected].sort((a, b) => a - b));

function openLb(i){
  current = (i + PHOTOS.length) % PHOTOS.length;
  $("lbImg").src = thumb(PHOTOS[current]); $("lbImg").alt = "Fotografia " + (current + 1);
  const hi = new Image(); hi.onload = () => { if (PHOTOS[current] && $("lbImg").alt === "Fotografia " + (current + 1)) $("lbImg").src = hi.src; }; hi.src = full(PHOTOS[current]);
  $("lbDl").href = full(PHOTOS[current]); $("lbDl").setAttribute("download", PHOTOS[current]);
  $("lb").classList.add("open"); refresh();
}
$("prev").onclick = () => openLb(current - 1);
$("next").onclick = () => openLb(current + 1);
$("lbPick").onclick = () => toggle(current);
$("close").onclick = () => $("lb").classList.remove("open");
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") $("close").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});
</script>
</body>
</html>
