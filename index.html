<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria · Pozele tale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fffdfd; --blush:#fbeef0; --powder:#f3d5db; --rose:#c97b8d; --ink:#3a2a2e; --muted:#8a7378;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--white);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;display:flex;flex-direction:column;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.notice{background:var(--powder);text-align:center;padding:.7rem 1.2rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));font-size:.92rem;font-weight:400}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(100deg,var(--blush),var(--white) 70%)}
.txt{display:flex;flex-direction:column;justify-content:center;padding:clamp(2rem,6vw,6rem)}
h1{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(5rem,16vw,13rem);line-height:.85;letter-spacing:-.02em}
.txt p{max-width:26rem;margin:1.8rem 0 2.2rem;color:var(--muted);font-size:1.05rem}
.go{align-self:flex-start;font-weight:400;border:1px solid var(--rose);background:var(--rose);color:#fff;padding:.9rem 2rem;border-radius:999px;text-decoration:none;transition:background .2s}
.go:hover{background:#b5687a}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.small{margin:1.2rem 0 0!important;font-size:.9rem!important}
.pic{background:var(--powder);min-height:60vh}
.pic img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
@media (max-width:760px){main{grid-template-columns:1fr}.pic{order:-1;min-height:55vh}.txt{padding:2rem 1.5rem 3rem}}
</style>
</head>
<body>

<div class="notice" id="notice"></div>

<main>
  <div class="txt">
    <h1>Maria</h1>
    <p>Toate fotografiile tale sunt într-un singur fișier zip. Apasă butonul și le descarci pe toate odată.</p>
    <a class="go" id="dl" href="#">Descarcă toate pozele (zip)</a>
    <p class="small" id="small"></p>
  </div>
  <div class="pic"><img src="maria.jpg" alt="Maria" onerror="this.remove()"></div>
</main>

<script>
/* ===== SETĂRI ===== */
const CLOSE_DATE = "2026-12-09";   // data la care se închide site-ul (AAAA-LL-ZZ)
const ZIP_URL    = "https://we.tl/t-2VQTp4o91SGxzG9n";             // linkul direct către zip (vezi instrucțiunile)
/* ================== */

const close = new Date(CLOSE_DATE + "T23:59:59");
const days = Math.max(0, Math.ceil((close - new Date()) / 864e5));
const dateRo = close.toLocaleDateString("ro-RO", {day:"numeric", month:"long", year:"numeric"});
document.getElementById("notice").textContent = "Acest site este temporar și se va închide pe " + dateRo +
  (days > 0 ? " (mai sunt " + days + (days === 1 ? " zi" : " zile") + ")" : "") +
  ". Te rugăm să-ți descarci pozele până atunci.";
document.getElementById("small").textContent = "Linkul rămâne activ până pe " + dateRo + ".";

const dl = document.getElementById("dl");
if (ZIP_URL) { dl.href = ZIP_URL; }
else { dl.style.display = "none"; document.getElementById("small").textContent = "Linkul de descărcare va fi adăugat în curând."; }
</script>
</body>
</html>
