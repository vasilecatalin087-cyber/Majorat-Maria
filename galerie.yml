name: Actualizează galeria

on:
  push:
    paths:
      - 'poze/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generează miniaturi și lista de poze
        run: |
          mkdir -p thumbs
          ls poze | grep -iE '\.(jpe?g|png|webp)$' | sort -V > list.txt

          # miniaturi (doar pentru pozele noi)
          while IFS= read -r n; do
            [ -f "thumbs/$n" ] || convert "poze/$n" -auto-orient -resize 1000x -quality 80 "thumbs/$n"
          done < list.txt

          # poza principală: fișierul al cărui nume începe cu "principala"
          hero=$(grep -i '^principala\.' list.txt | head -1 || true)
          if [ -n "$hero" ]; then
            convert "poze/$hero" -auto-orient -resize 2000x -quality 82 thumbs/hero.jpg
          fi

          jq -R -s --arg hero "$hero" \
            '{hero: $hero, photos: (split("\n") | map(select(length > 0)))}' list.txt > photos.json
          rm list.txt

      - name: Salvează rezultatul
        run: |
          git config user.name "galerie-bot"
          git config user.email "galerie-bot@users.noreply.github.com"
          git add thumbs photos.json
          git diff --cached --quiet || (git commit -m "Actualizare galerie" && git push)
